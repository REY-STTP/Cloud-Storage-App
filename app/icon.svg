<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cloud Storage favicon: cloud mark with a negative-space "drive slot".
       The slot = the place where files go in. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8DF7"/>
      <stop offset="1" stop-color="#2059E0"/>
    </linearGradient>
    <mask id="slot">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="194" y="320" width="130" height="34" rx="17" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <g fill="#fff" mask="url(#slot)">
    <circle cx="184" cy="288" r="72"/>
    <circle cx="306" cy="258" r="100"/>
    <rect x="112" y="278" width="294" height="106" rx="53"/>
  </g>
</svg>
