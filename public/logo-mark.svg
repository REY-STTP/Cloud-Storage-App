<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand mark: cloud + negative-space drive slot. For light backgrounds. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8DF7"/>
      <stop offset="1" stop-color="#2059E0"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="194" y="320" width="130" height="34" rx="17" fill="#000"/>
    </mask>
  </defs>
  <g fill="url(#mark)" mask="url(#cut)">
    <circle cx="184" cy="288" r="72"/>
    <circle cx="306" cy="258" r="100"/>
    <rect x="112" y="278" width="294" height="106" rx="53"/>
  </g>
</svg>
